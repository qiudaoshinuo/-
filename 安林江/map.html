<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图 - 当前位置</title>
  <!-- Leaflet 锁定版本，避免生产环境因库升级而出问题 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // 初始中心：北京 (39.9042, 116.4074)，后续会尝试定位到用户位置
    var DEFAULT_CENTER = [39.9042, 116.4074];
    var DEFAULT_ZOOM = 10;

    var map = L.map('map').setView(DEFAULT_CENTER, DEFAULT_ZOOM);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        function (position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          map.setView([lat, lng], 13);
          L.marker([lat, lng])
            .addTo(map)
            .bindPopup('您在这里！')
            .openPopup();
        },
        function (error) {
          // 静默降级：留在默认位置，仅在控制台记录
          console.warn('定位失败：', error && error.message);
        },
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
      );
    } else {
      console.warn('当前浏览器不支持地理位置 API');
    }
  </script>

</body>
</html>
